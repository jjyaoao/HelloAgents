[build-system]
requires = ["setuptools>=84.0,<85", "wheel>=0.48,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-agents"
version = "1.0.1"
description = "模块化智能体框架 - Agent Loop、MCP、上下文、知识检索与结构化记忆"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
authors = [
    {name = "HelloAgents Team", email = "jjyaoao@126.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    # 核心依赖
    "openai>=1.109.1,<1.110",
    "python-dotenv>=1.2.4,<1.3",
    "pydantic>=2.13.5,<2.14",
    "tiktoken>=0.14.0,<0.15",
    "pyyaml>=6.0.3,<6.1",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<9.2", "pytest-asyncio>=1.4.0,<1.5", "jsonschema>=4.26.0,<4.27"]
web = ["fastapi>=0.142.2,<0.143", "uvicorn>=0.54.0,<0.55", "httpx>=0.28.1,<0.29"]
mcp = ["mcp>=2.3.0,<2.4", "jsonschema>=4.26.0,<4.27"]
qdrant = ["qdrant-client>=1.19.1,<1.20"]
fastembed = ["qdrant-client>=1.19.1,<1.20", "fastembed>=0.8.1,<0.9"]
graphrag = ["igraph>=1.0.0,<1.1", "leidenalg>=0.12.0,<0.13"]
gemini = ["google-genai>=2.28.0,<2.29"]
anthropic = ["anthropic>=1.11.0,<1.12"]

[tool.uv]
required-version = ">=0.12.23,<0.13"

[dependency-groups]
quality = ["ruff>=0.16.10,<0.17", "coverage>=7.16.2,<7.17", "pip-audit>=2.10.1,<2.11"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["hello_agents"]
branch = true

[tool.coverage.report]
fail_under = 82
show_missing = true
skip_empty = true
precision = 2

[project.urls]
Homepage = "https://github.com/jjyaoao/HelloAgents"
Documentation = "https://github.com/jjyaoao/HelloAgents/blob/main/README.md"
Repository = "https://github.com/jjyaoao/HelloAgents"
"Bug Tracker" = "https://github.com/jjyaoao/HelloAgents/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hello_agents*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
hello_agents = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
